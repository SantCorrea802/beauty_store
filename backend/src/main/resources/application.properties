spring.application.name=hajuvi-store

server.port=${PORT:8080}

app.brand.name=${APP_BRAND_NAME:Hajuvi}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}

app.jwt.secret=${JWT_SECRET}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES:480}
app.jwt.issuer=${JWT_ISSUER:hajuvi-backend}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.cloudinary.product-images-folder=${CLOUDINARY_PRODUCT_IMAGES_FOLDER:hajuvi/dev/products}

app.business.whatsapp-number=${BUSINESS_WHATSAPP_NUMBER:}

app.customer.email-verification-url=${CUSTOMER_EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
app.customer.email-verification-token-expires-minutes=${CUSTOMER_EMAIL_VERIFICATION_TOKEN_EXPIRES_MINUTES:1440}

app.customer.password-reset-url=${CUSTOMER_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.customer.password-reset-token-expires-minutes=${CUSTOMER_PASSWORD_RESET_TOKEN_EXPIRES_MINUTES:30}

# Email provider:
# dev  -> imprime correos en consola
# smtp -> envía correos reales por SMTP
app.email.provider=${EMAIL_PROVIDER:dev}

app.email.from=${EMAIL_FROM:no-reply@hajuvi.com}
app.email.from-name=${EMAIL_FROM_NAME:Hajuvi}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}

app.resend.api-key=${RESEND_API_KEY:}
app.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}

app.admin.invitation-url=${ADMIN_INVITATION_URL:http://localhost:5173/admin/accept-invitation}
app.admin.invitation-token-expires-minutes=${ADMIN_INVITATION_TOKEN_EXPIRES_MINUTES:1440}